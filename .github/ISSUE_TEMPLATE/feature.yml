name: Feature request
description: Something Screenfin should do.
labels: [feature]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Where
      options: [All platforms, iPhone / iPad, Apple TV, Android TV, Android phone / tablet, Web, Server]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What, and why
      description: What you want to be able to do, and the situation that made you want it.
    validations:
      required: true
